[project]
name = "img2pdfify"
version = "0.3.0"
description = "Convert images to PDF, merge, split, lock and unlock PDFs from the command line"
authors = [{ name = "Sharan Thakur" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Pillow",
    "pypdf[crypto]",
    "pypdfium2",
    "tqdm",
]

[project.scripts]
img2pdfify = "img2pdfify.__main__:main"